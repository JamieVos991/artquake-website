<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#0b0b0b" />
		<meta name="text-scale" content="scale" />
		<!-- GitHub Pages kan geen eigen headers sturen, dus de beveiligingsregels staan hier:
		     scripts en verbindingen alleen naar de diensten die de site gebruikt (Firebase/Google,
		     Plausible, de mail-API). Komt er een nieuwe dienst bij, zet die dan ook hier. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="script-src 'self' 'unsafe-inline' https://plausible.io https://challenges.cloudflare.com; connect-src 'self' ws://localhost:* https://*.googleapis.com https://plausible.io https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'"
		/>
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<!-- niet tonen in een frame van een andere site (tegen clickjacking): GitHub Pages
		     kan daar geen header voor sturen. Op elke pagina, want binnen de site wisselt
		     de browser van pagina zonder opnieuw te laden. -->
		<script>
			if (window.top !== window.self) document.documentElement.style.display = "none";
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- lettertypes laden zonder de pagina op te houden: de tekst verschijnt
		     meteen en wisselt naar Archivo/Space Mono zodra die binnen zijn -->
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Space+Mono:wght@400;700&display=swap"
			onload="this.onload=null;this.rel='stylesheet'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Space+Mono:wght@400;700&display=swap"
			/>
		</noscript>
		<!-- Privacy-friendly analytics by Plausible. Niet op de crewpagina's (daar
		     staat de inlog van de crew) en niet op /annuleren (daar staat de geheime
		     annuleercode in de link): daar draait geen script van buiten. -->
		<script>
			window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
			if (!/^\/(login|dashboard|reserveren|annuleren)(\/|\.html)?$/.test(location.pathname)) {
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://plausible.io/js/pa-L1_Ek66ILEgM7kmrI214g.js';
				document.head.appendChild(s);
				plausible.init();
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
