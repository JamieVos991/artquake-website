<!--
  Template voor de verificatiecode.
  Het onderwerp staat in scripts/vimexx-reservering-mail.php.
  Gebruikte variabelen: {{naam}}, {{code}}

  npm run build plakt deze HTML (zonder dit commentaar) in
  reservering-mail.php; {{...}} vult dat script in. De opmaak gebruikt
  <div>'s en inline stijlen, zodat het in alle mailprogramma's goed staat.
  Het logo komt van art-quake.com/mail/artquake-logo.png (static/mail/, PNG
  omdat mailprogramma's geen AVIF tonen); de balk erachter is donker omdat het
  logo zelf paars en oranje is.
-->
<div style="background:#0b0b0b; padding:32px 16px;">
  <div style="max-width:480px; margin:0 auto; background:#141414; border-radius:8px; overflow:hidden;">
    <div style="background:#0b0b0b; border-bottom:4px solid #f2a81c; padding:16px 32px;">
      <img src="https://art-quake.com/mail/artquake-logo.png" width="135" height="90" alt="ARTQUAKE" style="display:block; border:0; font-family:Arial, Helvetica, sans-serif; font-weight:900; font-size:20px; color:#f4f1ea;" />
    </div>
    <div style="padding:32px; background:#141414;">
      <p style="margin:0 0 16px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#f4f1ea;">
        Hoi {{naam}},
      </p>
      <p style="margin:0 0 24px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#f4f1ea;">
        Gebruik onderstaande code om je reservering bij Artquake te bevestigen:
      </p>
      <div style="text-align:center; padding:12px 0 24px;">
        <span style="display:inline-block; padding:16px 28px; background:#0b0b0b; border:1.5px solid #8a19e8; border-radius:6px; font-family:'Courier New', monospace; font-weight:700; font-size:32px; letter-spacing:0.3em; color:#f4f1ea;">{{code}}</span>
      </div>
      <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:13px; line-height:1.6; color:#9a9a9a;">
        Deze code is 15 minuten geldig. Niet zelf om een code gevraagd? Dan kun je deze mail negeren.
      </p>
    </div>
    <div style="padding:20px 32px; background:#141414; border-top:1px solid #242424;">
      <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:11px; letter-spacing:0.08em; color:#9a9a9a;">
        ARTQUAKE · Sara de Bronovoland 7, Heerhugowaard
      </p>
    </div>
  </div>
</div>
